<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>质检平台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/qc.css">
</head>
<body>
<header class="qc-topbar">
  <div class="qc-title">质检平台</div>
  <label class="qc-field">项目
    <select id="qcProject"></select>
  </label>
  <label class="qc-field">质检员
    <select id="qcReviewer"></select>
  </label>
  <div class="qc-spacer"></div>
  <div class="qc-counts" id="qcCounts"></div>
  <div class="qc-daily-stats" id="qcDailyStats"></div>
  <button id="qcPass" class="btn success" disabled>通过</button>
  <button id="qcReject" class="btn danger" disabled>打回</button>
  <button id="qcSave" class="btn primary hidden" disabled>保存</button>
  <button id="qcSettings" class="btn">设置</button>
  <a class="btn link-btn" id="linkAnno" href="/anno">作业平台</a>
  <a class="btn link-btn" href="javascript:logout()">退出</a>
</header>

<main class="qc-workspace">
  <!-- 左侧：属性 -->
  <aside class="qc-side">
    <div class="qc-cats" id="qcCats"></div>
    <div class="qc-hint">左键拖动画框 · 右键拖动平移 · 单击选中 · 双击删除 · 快捷键选属性 · C通过 / R打回</div>
  </aside>

  <!-- 中间：照片 -->
  <section class="qc-main">
    <div id="qcViewer" class="viewer full"><div class="empty">请选择图片</div></div>
  </section>

  <!-- 右侧：图片列表 -->
  <aside class="qc-list-panel">
    <div class="qc-filters">
      <input id="qcSearch" placeholder="搜索文件名">
      <select id="qcAnnotatorFilter"><option value="">全部作业员</option></select>
      <div class="label-picker" id="qcCatPicker">
        <div class="label-picker-field" id="qcCatPickerField">
          <span class="placeholder">按属性筛选（可多选）</span>
        </div>
        <div class="label-picker-dropdown hidden" id="qcCatPickerDropdown"></div>
      </div>
    </div>
    <div class="qc-list-tabs">
      <button class="qc-tab active" data-status="pending">未质检<span class="qc-badge" id="badgePending"></span></button>
      <button class="qc-tab" data-status="passed">已通过<span class="qc-badge" id="badgePassed"></span></button>
      <button class="qc-tab" data-status="rejected">已打回<span class="qc-badge" id="badgeRejected"></span></button>
      <button class="qc-tab" data-status="recent">最近提交</button>
    </div>
    <div id="qcList" class="qc-list-items"></div>
  </aside>
</main>

<!-- 质检员登录（局域网访问且未内置登录时弹出） -->
<div id="reviewerLogin" class="settings hidden">
  <div class="settings-box">
    <div class="settings-head">
      <span>质检员登录 <span id="reviewerLoginName"></span></span>
      <button id="reviewerLoginClose" class="settings-close">×</button>
    </div>
    <div class="settings-body">
      <div class="hint">该质检员未内置登录，请输入其账号密码后查看数据</div>
      <input id="reviewerLoginEmail" placeholder="邮箱（v_xxx@baidu.com）" style="width:100%;padding:8px;border:1px solid #ccd2d9;border-radius:6px;">
      <input id="reviewerLoginPassword" type="password" placeholder="密码" style="width:100%;padding:8px;border:1px solid #ccd2d9;border-radius:6px;">
    </div>
    <div class="settings-foot">
      <button id="reviewerLoginCancel" class="btn">取消</button>
      <button id="reviewerLoginOk" class="btn primary">登录</button>
    </div>
  </div>
</div>

<!-- 快捷键设置 -->
<div id="settings" class="settings hidden">
  <div class="settings-box">
    <div class="settings-head">
      <span>快捷键设置</span>
      <button id="settingsClose" class="settings-close">×</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
    <div class="settings-foot">
      <button id="settingsReset" class="btn">恢复默认</button>
      <button id="settingsSave" class="btn primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/viewer.js"></script>
<script src="/static/qc.js"></script>
</body>
</html>
