<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标注平台</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #f4f5f7; color: #222;
}
.box {
  width: 320px; display: flex; flex-direction: column; gap: 12px;
  background: #fff; padding: 28px; border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.08);
}
.box h2 { margin: 0 0 8px; text-align: center; }
.box input {
  padding: 10px 12px; border: 1px solid #ccd2d9; border-radius: 6px; font-size: 14px;
}
.box button {
  padding: 10px; border: none; border-radius: 6px; background: #2b6de8; color: #fff;
  font-size: 14px; cursor: pointer;
}
.box button.secondary { background: #fff; color: #2b6de8; border: 1px solid #2b6de8; }
.hint { font-size: 12px; color: #e5484d; text-align: center; min-height: 16px; }
</style>
</head>
<body>
<div class="box">
  <h2>标注平台登录</h2>
  <input id="email" placeholder="邮箱（v_xxx@baidu.com）">
  <input id="password" type="password" placeholder="密码">
  <button id="btn">登录</button>
  <div class="hint" id="err"></div>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const AUTH_KEY = 'la_auth';
function getAuth() {
  try { const raw = localStorage.getItem(AUTH_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return {};
}
function setAuth(token, user) {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify({ token: token, user: user })); } catch (e) {}
}
async function api(path, options) {
  const opts = Object.assign({ headers: {} }, options || {});
  if (opts.body && typeof opts.body === 'object') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(path, opts);
  const ct = r.headers.get('Content-Type') || '';
  if (ct.includes('application/json')) return await r.json();
  return r;
}
function route(user) {
  const role = (user && user.role) || '';
  if (role === 'member') location.href = '/anno';
  else if (role === 'qc' || role === 'admin') location.href = '/qc';
  else $('err').textContent = '该账号无质检/作业权限';
}
function onLogin(r) {
  if (r && r.ok) { setAuth(r.token, r.user); route(r.user); }
  else $('err').textContent = (r && r.error) || '登录失败，请检查账号密码';
}
async function login() {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { $('err').textContent = '请输入邮箱和密码'; return; }
  const btn = $('btn');
  btn.disabled = true;
  let r;
  try {
    r = await api('/api/login', { method: 'POST', body: { email, password } });
  } catch (e) {
    btn.disabled = false;
    $('err').textContent = '登录失败（网络或服务异常）';
    return;
  }
  btn.disabled = false;
  onLogin(r);
}
async function init() {
  const auth = getAuth();
  if (auth.token) route(auth.user);
}
$('btn').onclick = login;
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
init();
</script>
</body>
</html>
